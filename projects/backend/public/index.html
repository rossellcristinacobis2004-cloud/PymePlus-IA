<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0F766E" />
    <title>PymePlus IA</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      main { text-align: center; padding: 2rem; }
      h1 { color: #0f766e; margin-bottom: .25rem; }
      p { color: #1e40af; }
      code { background: #e2e8f0; padding: .15rem .4rem; border-radius: .3rem; }
      @media (prefers-color-scheme: dark) {
        body { background: #0f172a; color: #e2e8f0; }
        code { background: #334155; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>PymePlus IA</h1>
      <p>Backend inicializado correctamente.</p>

</html>
