<div class="app-shell" [class.app-shell--sidebar-open]="sidebarOpen()">
  @if (sidebarOpen()) {
    <div class="app-shell__backdrop" (click)="closeSidebar()" aria-hidden="true"></div>
  }

  <aside class="app-shell__sidebar d-flex flex-column">
    <div class="brand-mark mb-4">
      <span class="brand-mark__icon"><i class="bi bi-bag-check"></i></span>
      <div>
        <div>PymePlus IA</div>
        <div class="small text-secondary fw-normal">POS · Inventario · Finanzas</div>
      </div>
    </div>

    <nav class="nav flex-column nav-soft" aria-label="Navegación principal">
      <a routerLink="/pos" routerLinkActive="active" class="nav-link" (click)="closeSidebar()">
        <i class="bi bi-cash-coin me-2"></i>
        Punto de venta
      </a>
      <a routerLink="/inventario" routerLinkActive="active" class="nav-link" (click)="closeSidebar()">
        <i class="bi bi-box-seam me-2"></i>
        Inventario
      </a>
      <a routerLink="/ventas" routerLinkActive="active" class="nav-link" (click)="closeSidebar()">
        <i class="bi bi-receipt me-2"></i>
        Ventas
      </a>
      <button type="button" class="nav-link btn text-start" disabled title="Disponible en la siguiente entrega">
        <i class="bi bi-people me-2"></i>
        Clientes
      </button>
      @if (canViewReports()) {
        <a routerLink="/reportes" routerLinkActive="active" class="nav-link" (click)="closeSidebar()">
          <i class="bi bi-bar-chart-line me-2"></i>
          Reportes
        </a>
      }
      @if (canManageUsers()) {
        <a routerLink="/usuarios" routerLinkActive="active" class="nav-link" (click)="closeSidebar()">
          <i class="bi bi-person-gear me-2"></i>
          Usuarios
        </a>
      }
    </nav>

    <div class="mt-auto small text-secondary pt-4">
      <i class="bi bi-shield-check me-1"></i>
      Datos auditados en USD/VES
    </div>
  </aside>

  <div class="app-shell__main">
    <header class="app-shell__topbar d-flex align-items-center justify-content-between gap-3 px-3 py-2 border-bottom bg-body">
      <div class="d-flex align-items-center gap-2">
        <button
          type="button"
          class="btn btn-sm btn-outline-secondary app-shell__nav-toggle"
          (click)="toggleSidebar()"
          [attr.aria-expanded]="sidebarOpen()"
          aria-label="Abrir navegación"
        >
          <i class="bi bi-list"></i>
        </button>
        <span class="badge text-bg-primary-subtle text-primary-emphasis">Panel operativo</span>
        <app-rate-widget />
      </div>

      <div class="d-flex align-items-center gap-2">
        <button type="button" class="btn btn-sm btn-outline-secondary" (click)="toggleTheme()" [attr.aria-label]="'Cambiar tema'">
          <i class="bi" [class.bi-moon]="theme() === 'light'" [class.bi-sun]="theme() === 'dark'"></i>
        </button>
        <div class="text-end d-none d-sm-block">
          <div class="small fw-semibold">{{ user()?.name || 'Usuario' }}</div>
          <div class="text-secondary small">{{ user()?.role || '—' }}</div>
        </div>
        <button type="button" class="btn btn-sm btn-outline-danger" (click)="logout()">
          <i class="bi bi-box-arrow-right me-1"></i>
          <span class="d-none d-md-inline">Salir</span>
        </button>
      </div>
    </header>

    <main class="app-shell__content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
