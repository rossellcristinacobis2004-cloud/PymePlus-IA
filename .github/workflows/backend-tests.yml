name: Backend tests

on:
  push:
    paths:
      - 'projects/backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'projects/backend/**'
      - '.github/workflows/backend-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: projects/backend/package-lock.json
      - run: npm ci
      - run: find . -path ./node_modules -prune -o -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: npm test
      - run: npm run test:smoke
      - run: npm run test:integration
      - run: npm audit --audit-level=high
